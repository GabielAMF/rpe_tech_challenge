name: rpe-tech-challenge

# Shared settings for the three applications.
x-app-env: &app-env
  DB_HOST: postgres
  DB_NAME: ${DB_NAME:-rpe}
  DB_USER: ${DB_USER:-app}
  DB_PASSWORD: ${DB_PASSWORD:-app}
  AWS_REGION: ${AWS_REGION:-us-east-1}
  AWS_SQS_ENDPOINT: http://localstack:4566
  CLIENT_MANAGER_QUEUE: ${CLIENT_MANAGER_QUEUE:-rpe-client-manager-queue}

# Actuator health, checked with busybox wget (the alpine JRE image has no curl). start_period covers JVM startup.
x-app-healthcheck: &app-healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 60s

x-infra-deps: &infra-deps
  postgres:
    condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    container_name: rpe-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-rpe}
      POSTGRES_USER: ${DB_USER:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates rpe_test (used by the automated tests) when the volume is new.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rpe-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    # Pinned to 4.14: the newer calendar-versioned tags (2026.x) may require a LOCALSTACK_AUTH_TOKEN.
    image: localstack/localstack:4.14
    container_name: rpe-localstack
    environment:
      SERVICES: sqs
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      CLIENT_MANAGER_QUEUE: ${CLIENT_MANAGER_QUEUE:-rpe-client-manager-queue}
    ports:
      - "4566:4566"
    volumes:
      - ./docker/localstack/init/ready.d:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs get-queue-url --queue-name $${CLIENT_MANAGER_QUEUE} >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Kafka (KRaft mode, no Zookeeper) - uncomment when needed, along with spring-kafka in pom.xml.
  # kafka:
  #   image: apache/kafka:3.9.1
  #   container_name: rpe-kafka
  #   ports:
  #     - "9092:9092"
  #   environment:
  #     KAFKA_NODE_ID: 1
  #     KAFKA_PROCESS_ROLES: broker,controller
  #     KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,EXTERNAL://:9092
  #     KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
  #     KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
  #     KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
  #     KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
  #     KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
  #     KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  #     KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
  #     KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  # ---------------------------------------------------------------------------
  # Applications. `docker compose up --build` starts them together with the infrastructure.
  # Inside the network they reach each other by service name, e.g. http://rpe-catalog:8080
  # ---------------------------------------------------------------------------
  rpe-catalog:
    build: ./rpe_catalog
    container_name: rpe-catalog
    ports:
      - "8080:8080"
    environment:
      <<: *app-env
      SERVER_PORT: 8080
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
    # The catalog calls no other service, so it only needs the database.
    depends_on:
      postgres:
        condition: service_healthy

  rpe-client-manager:
    build: ./rpe_client_manager
    container_name: rpe-client-manager
    ports:
      - "8082:8082"
    environment:
      <<: *app-env
      SERVER_PORT: 8082
      CARD_PROCESSOR_BASE_URL: http://rpe-card-processor:8083
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8082/actuator/health | grep -q UP"]
    # rpe-card-processor isn't a dependency: without it, GET /customers/{id} still answers (without the card).
    depends_on:
      <<: *infra-deps
      localstack:
        condition: service_healthy

  rpe-card-processor:
    build: ./rpe_card_processor
    container_name: rpe-card-processor
    ports:
      - "8083:8083"
    environment:
      <<: *app-env
      SERVER_PORT: 8083
      # Only the card processor caches.
      REDIS_HOST: redis
      CATALOG_BASE_URL: http://rpe-catalog:8080
    healthcheck:
      <<: *app-healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/actuator/health | grep -q UP"]
    depends_on:
      <<: *infra-deps
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      rpe-catalog:
        condition: service_healthy

volumes:
  postgres-data:
