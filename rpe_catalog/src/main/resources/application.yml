server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: rpe-catalog

  # All services share the same database.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rpe}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Each service keeps its own migration history table, so migrations from
  # different services don't collide in the shared database.
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_history_catalog
    baseline-on-migrate: true
    baseline-version: 0

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 10m
      key-prefix: "rpe-catalog::"

# Base URLs of the external services we call. Locally they all point to WireMock.
integrations:
  external-api:
    base-url: ${EXTERNAL_API_BASE_URL:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
