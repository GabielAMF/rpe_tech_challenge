server:
  port: ${SERVER_PORT:8082}

spring:
  application:
    name: rpe-client-manager

  # All services share the same database.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rpe}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Each service keeps its own migration history table, so migrations from
  # different services don't collide in the shared database.
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_history_client_manager
    baseline-on-migrate: true
    baseline-version: 0

  cloud:
    openfeign:
      client:
        config:
          # Card info is optional in GET /customers/{id}: fail fast and answer without it.
          card-processor:
            connect-timeout: 1000
            read-timeout: 2000
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:test}
        secret-key: ${AWS_SECRET_ACCESS_KEY:test}
      sqs:
        endpoint: ${AWS_SQS_ENDPOINT:http://localhost:4566}

# Base URLs of the services we call. rpe_card_processor isn't implemented yet, so it points to WireMock
# (docker/wiremock/mappings); switch CARD_PROCESSOR_BASE_URL to the real service once it exists.
integrations:
  card-processor:
    base-url: ${CARD_PROCESSOR_BASE_URL:http://localhost:8081}

app:
  customer:
    # Minimum age to register a customer. 0 disables the check: the rule is implemented and tested, but the
    # actual minimum age varies (product, regulation) and isn't confirmed yet, so it is not enforced.
    minimum-age: ${CUSTOMER_MINIMUM_AGE:0}
  security:
    jwt:
      # HS256 signing key, at least 32 bytes. The default is for local development only:
      # always set JWT_SECRET anywhere else.
      secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
      expiration: ${JWT_EXPIRATION:1h}
      issuer: rpe-client-manager
    # Created on startup (as ADMIN) if no user with this username exists. Leave the username empty to skip.
    bootstrap-user:
      username: ${AUTH_BOOTSTRAP_USERNAME:admin}
      password: ${AUTH_BOOTSTRAP_PASSWORD:admin12345}
  sqs:
    # Published by rpe_client_manager, consumed by rpe_card_processor.
    client-manager-queue: ${CLIENT_MANAGER_QUEUE:rpe-client-manager-queue}
    # How long customer creation waits for SQS before answering 503.
    send-timeout: ${SQS_SEND_TIMEOUT:5s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
