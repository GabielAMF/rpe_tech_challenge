server:
  port: ${SERVER_PORT:8083}

spring:
  application:
    name: rpe-card-processor

  # All services share the same database.
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:rpe}
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:app}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Each service keeps its own migration history table, so migrations from
  # different services don't collide in the shared database.
  flyway:
    enabled: true
    locations: classpath:db/migration
    table: flyway_history_card_processor
    baseline-on-migrate: true
    baseline-version: 0

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  cache:
    type: redis
    redis:
      time-to-live: 10m
      key-prefix: "rpe-card-processor::"

  cloud:
    openfeign:
      client:
        config:
          catalog:
            connect-timeout: 1000
            read-timeout: 2000
    aws:
      region:
        static: ${AWS_REGION:us-east-1}
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:test}
        secret-key: ${AWS_SECRET_ACCESS_KEY:test}
      sqs:
        endpoint: ${AWS_SQS_ENDPOINT:http://localhost:4566}

# Base URLs of the services we call.
integrations:
  catalog:
    base-url: ${CATALOG_BASE_URL:http://localhost:8080}

app:
  card:
    # Used when credit_info doesn't name a usable product (placeholder rule, see ProductSelectionPolicy).
    # GOLD, seeded by rpe_catalog's V2 migration.
    default-product-id: ${CARD_DEFAULT_PRODUCT_ID:3f2b6c1e-8d4a-4f7b-9c2e-1a5d6e7f8a9b}
    # AES-256 key (base64 of 32 bytes) encrypting card number, expiry and CVV at rest.
    # The default is for local development only: always set CARD_ENCRYPTION_KEY anywhere else.
    encryption-key: ${CARD_ENCRYPTION_KEY:KVDNF2P5/Khe098CnK7Ny3gnH3UYI9aSFdM8y2c8ScM=}
    validity-years: 5
  sqs:
    # Published by rpe_client_manager, consumed by rpe_card_processor.
    client-manager-queue: ${CLIENT_MANAGER_QUEUE:rpe-client-manager-queue}
    # Where SQS moves a message after 3 failed receives (redrive policy in docker/localstack/init).
    client-manager-dlq: ${CLIENT_MANAGER_DLQ:rpe-client-manager-queue-dlq}
    # Backoff after each failed attempt (SqsConfig): 5s, 20s, 80s; the 4th receive moves it to the DLQ instead.
    retry:
      initial-backoff: ${SQS_RETRY_INITIAL_BACKOFF:5s}
      multiplier: 4
      max-backoff: ${SQS_RETRY_MAX_BACKOFF:5m}
    # Logs at ERROR while the DLQ isn't empty (DeadLetterQueueMonitor).
    dlq-monitor:
      enabled: true
      interval: ${DLQ_MONITOR_INTERVAL:1m}

management:
  endpoints:
    web:
      exposure:
        include: health,info
